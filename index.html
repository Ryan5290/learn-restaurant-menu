        </section>

        <section class="cart hide">
            <h2>Your order</h2>
            <div class="cart-items">
                <div class="item-info">
                    <p class="cart-item">Pizza</p>
                    <button>remove</button>
                    <p class="cart-price">$14</p>
                </div>
                <div class="item-info">
                    <p class="cart-item">Pizza</p>

                    <p class="cart-price">$14</p>
                </div>
                <hr>
                <div class="item-total">
                    <p class="cart-item">Total price:</p>
                    <p class="cart-price">$26</p>
                </div>
            </div>
            <button class="order-btn">Complete order</button>
        </section>

        <section class="order-thank hide">
            <p>Thanks, James! Your order is on its way!</p>
        </section>

        <section class="pay-modal hide">
            <form id="pay-form">
                <fieldset>
                    <legend>Enter card details</legend>
                    <input 
                        type="text" 
                        placeholder="Enter your name" 
                        id="pay-name" 
                        required>
                    <input 
                        type="number" 
                        placeholder="Enter card number" 
                        id="pay-card" 
                        required>
                    <input 
                        type="text"
                        placeholder="Enter CVV"
                        id="pay-cvv"
                        inputmode="numeric"
                        pattern="[0-9]{3}"
                        maxlength="3"
                        required>
                    <button type="submit">Pay</button>
                </fieldset>
            </form>
        </section>
