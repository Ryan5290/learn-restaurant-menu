<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mobile Restaurant Menu</title>
        <link rel="icon" href="data:,">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href=
            "https://fonts.googleapis.com/css2?family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" 
            rel="stylesheet">

        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <h1>Jimmy's Diner</h1>
            <p>The best burgers and pizzas in town.</p>
        </header>
        <section class="items" id="items">
            
        </section>

        <section class="cart hide" id="cart">
            <h2>Your order</h2>
            <div class="cart-items" id="cart-items">
                
            </div>
            <hr>
            <div class="item-total">
                <p class="cart-item">Total price:</p>
                <p class="cart-price" id="total-price">$26</p>
            </div> 
            <button class="order-btn" id="complete-order">Complete order</button>
        </section>

        <section class="order-thank hide" id="thank-message">
            <p id="thank-message-p"></p>
        </section>

        <section class="pay-modal hide" id="modal">
            <form id="pay-form">
                <fieldset>
                    <legend>Enter card details</legend>
                    <input 
                        name="name"
                        type="text" 
                        placeholder="Enter your name" 
                        id="pay-name" 
                        required>
                    <input 
                        name="number"
                        type="number" 
                        placeholder="Enter card number" 
                        id="pay-card" 
                        required>
                    <input 
                        name="cvv"
                        type="text"
                        placeholder="Enter CVV"
                        id="pay-cvv"
                        inputmode="numeric"
                        pattern="[0-9]{3}"
                        maxlength="3"
                        required>
                    <button type="submit" id="pay">Pay</button>
                </fieldset>
            </form>
        </section>
        

        <script src="index.js" type="module"></script>
    </body>
</html>
